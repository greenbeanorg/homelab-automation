---
- name: Configure garrett's fleet
  hosts: garrett_fleet
  become: true
  roles:
    - common

- name: Install and configure Icinga2
  hosts: icinga_hosts
  become: true
  roles:
    - icinga2

- name: Install and configure PostgreSQL
  hosts: postgres_hosts
  become: true
  roles:
    - postgresql

- name: Create the app database, user, and schema
  hosts: postgres_hosts
  become: true
  roles:
    - app-db

- name: Install k3s (server)
  hosts: k3s_server_hosts
  become: true
  roles:
    - k3s

- name: Join k3s agent nodes to the cluster
  hosts: k3s_agent_hosts
  become: true
  roles:
    - k3s-agent

- name: Build and deploy the app
  hosts: k3s_hosts
  become: true
  roles:
    - app-deploy

- name: Set up the public reverse proxy on kk1
  hosts: kk1_hosts
  become: true
  roles:
    - nginx-proxy
