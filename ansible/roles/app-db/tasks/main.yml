---
# Uses raw psql via shell rather than a community.postgresql/community.general
# module, deliberately, so this doesn't depend on a collection that may or
# may not be bundled with whatever Ansible install runs this. Every step
# checks first, so re-running this is always safe.

- name: Create app database if it doesn't already exist
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -tAc "SELECT 1 FROM pg_database WHERE datname='appdb'" | grep -q 1
    || psql -c "CREATE DATABASE appdb"
  register: db_create
  changed_when: "'CREATE DATABASE' in db_create.stdout"

- name: Create app db user if it doesn't already exist
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='appuser'" | grep -q 1
    || psql -c "CREATE ROLE appuser LOGIN PASSWORD '{{ app_db_password }}'"
  register: user_create
  changed_when: "'CREATE ROLE' in user_create.stdout"
  no_log: true # keeps the password out of ansible-playbook's console output/logs

- name: Grant privileges on appdb to appuser
  become: true
  become_user: postgres
  ansible.builtin.shell: >
    psql -d appdb -c "GRANT ALL PRIVILEGES ON DATABASE appdb TO appuser;"
    && psql -d appdb -c "GRANT ALL ON SCHEMA public TO appuser;"
  changed_when: true

- name: Copy the schema file to the postgres host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app/schema.sql"
    dest: /tmp/schema.sql
    mode: '0644'

- name: Apply the schema (CREATE TABLE IF NOT EXISTS - safe to re-run)
  become: true
  become_user: postgres
  ansible.builtin.command: psql -d appdb -f /tmp/schema.sql
  changed_when: true
