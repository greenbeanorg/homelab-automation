{
  "Dhcp4": {
    "interfaces-config": {
      "interfaces": [
        "eth0"
      ],
      "dhcp-socket-type": "udp",
      "service-sockets-require-all": true
    },
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "kea4-ctrl-socket"
      },
      {
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8004,
        "authentication": {
          "type": "basic",
          "realm": "kea-dhcp4",
          "directory": "/etc/kea",
          "clients": [
            {
              "user": "mcp-ro",
              "password-file": "kea-api-mcp.pw"
            }
          ]
        }
      }
    ],
    "lease-database": {
      "type": "postgresql",
      "name": "kea",
      "host": "127.0.0.1",
      "port": 5432,
      "user": "kea",
      "password": "SET-AT-DEPLOY",
      "max-reconnect-tries": 5,
      "reconnect-wait-time": 3000,
      "on-fail": "serve-retry-continue"
    },
    "host-reservation-identifiers": [
      "circuit-id",
      "hw-address",
      "client-id"
    ],
    "store-extended-info": true,
    "hooks-libraries": [
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_pgsql.so"
      },
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_lease_cmds.so"
      },
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_stat_cmds.so"
      },
      {
        "library": "/usr/lib64/kea/hooks/libdhcp_ha.so",
        "parameters": {
          "high-availability": [
            {
              "this-server-name": "kea1",
              "mode": "hot-standby",
              "heartbeat-delay": 10000,
              "max-response-delay": 60000,
              "max-ack-delay": 5000,
              "max-unacked-clients": 0,
              "sync-leases": true,
              "sync-timeout": 60000,
              "sync-page-limit": 10000,
              "restrict-commands": true,
              "multi-threading": {
                "enable-multi-threading": true,
                "http-dedicated-listener": true,
                "http-listener-threads": 0,
                "http-client-threads": 0
              },
              "peers": [
                {
                  "name": "kea1",
                  "url": "http://10.79.20.70:8005/",
                  "role": "primary",
                  "auto-failover": true,
                  "basic-auth-user": "kea-ha",
                  "basic-auth-password-file": "/etc/kea/kea-ha.pw"
                },
                {
                  "name": "kea2",
                  "url": "http://10.79.20.71:8005/",
                  "role": "standby",
                  "auto-failover": true,
                  "basic-auth-user": "kea-ha",
                  "basic-auth-password-file": "/etc/kea/kea-ha.pw"
                }
              ]
            }
          ]
        }
      }
    ],
    "valid-lifetime": 3600,
    "renew-timer": 900,
    "rebind-timer": 1800,
    "option-data": [
      {
        "name": "domain-name-servers",
        "data": "10.79.10.250, 10.79.10.249"
      },
      {
        "name": "domain-name",
        "data": "greenbean.org"
      }
    ],
    "subnet4": [
      {
        "id": 61,
        "subnet": "10.79.61.0/24",
        "pools": [
          {
            "pool": "10.79.61.100 - 10.79.61.199"
          }
        ],
        "option-data": [
          {
            "name": "routers",
            "data": "10.79.61.1"
          }
        ],
        "reservations": [
          {
            "circuit-id": "'olt1-pon61'",
            "ip-address": "10.79.61.50",
            "hostname": "olt1-pon61-static"
          }
        ]
      },
      {
        "id": 100,
        "subnet": "100.64.0.0/22",
        "pools": [
          {
            "pool": "100.64.0.10 - 100.64.3.250"
          }
        ],
        "relay": {
          "ip-addresses": [
            "10.79.20.140"
          ]
        },
        "valid-lifetime": 300,
        "renew-timer": 100,
        "rebind-timer": 200
      }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [
          {
            "output": "/var/log/kea/kea-dhcp4.log"
          }
        ],
        "severity": "INFO"
      }
    ]
  }
}
